program: qwen_fineTuning_PtoC_fixCps.py
name: Qwen LoRA Experts
description: "to save_params with all fixes and posterior predictive evaluation"
method: grid
metric:
  goal: maximize
  name: acc_val_curve
parameters:
  rng_seed:
    values: [1, 2, 4, 8]
  load_params_path:
    value: False
  data:
    parameters:
      dataset_path:
        values: ["ddold/qwen_PtoC/winogrande_m_dataset:v0", "ddold/qwen_PtoC/winogrande_s_dataset:v0", "ddold/qwen_PtoC/boolq_dataset:v0", "ddold/qwen_PtoC/obqa_dataset:v0", "ddold/qwen_PtoC/ARC-Challenge_dataset:v0", "ddold/qwen_PtoC/ARC-Easy_dataset:v0"]
  net_kwargs:
    parameters:
      model_path:
        value: "ddold/qwen_PtoC/qwen2.5_7B_bfloat16:v0"
  train_hyper:
    parameters:
      batch_size:
        values: [4]
      eval_every_n_batch:
        value: 25
      num_epochs:
        value: -1
      num_steps:
        value: 5000
      save_params:
        value: True
      dataset_sampling:
        parameters:
          expert:
            parameters:
              window_size:
                values: [4, 24]
              sort_mode:
                values: [False, "Hierarchical", "Spectral", "Random", "First_data"]
      temperature:
        value: [1.0]
  model_params:
    parameters:
      cp_fix:
        values:
          - [0, 0, 0]
      filter_masks:
        values:
          - [{keys: ["self_attn", "q_proj", "kernel"], op: all}, {keys: ["self_attn", "v_proj", "kernel"], op: all}, {keys: ["lm_head", "kernel"], op: all}]
      natural_parameterization:
        value: False
      weight_decay:
        value: 0.0
      jitter_multiplier:
        values: [0.0]
      gravity:
        value: 0.0
      energy_weakening:
        value: 1.0
      regularizer:
        value: False
      lora_params:
        parameters:
          use_lora:
            value: True
          r:
            value: 8
          lora_dtype:
            value: "float32"
          lora_alpha:
            value: 16.0
          lora_mode:
            values: ["A(t)B(t)", "As(t)B"]
          filter_masks:
            values:
              - [{keys: ["self_attn", "q_proj", "kernel"], op: all, dims: [1, 0]}, {keys: ["self_attn", "v_proj", "kernel"], op: all, dims: [1, 0]}, {keys: ["lm_head", "kernel"], op: all, dims: [1, 0]}]
  optimizer_conf:
    values:
      - {name: adamw, kwargs: {learning_rate: {name: linear_onecycle_schedule, kwargs: {transition_steps: 5000, peak_value: 1e-4, pct_start: 0.06, pct_final: 1.0, div_factor: 300.0, final_div_factor: 300}}, weight_decay: 0.01}, freeze_other_params: true}

command:
- ${env}
- ${interpreter}
- ${program}
- --use-sweep
