program: qwen_fineTuning_PtoC_fixCps.py
name: Qwen LoRA test
method: grid
metric:
  goal: maximize
  name: acc_val_curve
parameters:
  rng_seed:
    values: [1]
  data:
    parameters:
      dataset_path:
        value: "ddold/qwen_PtoC/winogrande_m_dataset:v0"
  net_kwargs:
    parameters:
      model_path:
        value: "ddold/qwen_PtoC/qwen2.5_0.5B_bfloat16:v0"
  train_hyper:
    parameters:
      batch_size:
        values: [16, 64]
      eval_every_n_batch:
        value: 25
      num_epochs:
        value: 50
      save_params:
        value: False
  model_params:
    parameters:
      cp_fix:
        values:
          - [1]
          - [0, 0, 0]
      filter_masks:
        values:
          - [{keys: ["self_attn", "q_proj", "kernel"], op: all}, {keys: ["self_attn", "v_proj", "kernel"], op: all}]
          - [{keys: ["self_attn", "q_proj", "kernel"], op: all}, {keys: ["self_attn", "q_proj", "bias"], op: all}]
      natural_parameterization:
        value: False
      weight_decay:
        value: 0.0
      jitter_multiplier:
        value: "1e-2"
      gravity:
        value: 0.0
      energy_weakening:
        value: 1.0
      regularizer:
        value: False
      lora_params:
        parameters:
          use_lora:
            value: True
          r:
            value: 8
          filter_masks:
            values:
              - [{keys: ["self_attn", "q_proj", "kernel"], op: all, dims: [0, 1]}, {keys: ["self_attn", "v_proj", "kernel"], op: all, dims: [0, 1]}]
  optimizer_conf:
    values:
      - {name: adamw, kwargs: {learning_rate: 0.0001, weight_decay: 1e-3}, grad_clip_norm: 150.0, freeze_other_params: true}
      - {name: sgd, kwargs: {learning_rate: 0.01, momentum: 0.9, nesterov: true}, grad_clip_norm: 150.0, freeze_other_params: true}
      - {name: sgd, kwargs: {learning_rate: 0.001, momentum: 0.9, nesterov: true}, grad_clip_norm: 150.0, freeze_other_params: true}
      - {name: sgd, kwargs: {learning_rate: 0.0001, momentum: 0.9, nesterov: true}, grad_clip_norm: 150.0, freeze_other_params: true}

command:
- ${env}
- ${interpreter}
- ${program}
- --use-sweep
