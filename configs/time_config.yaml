program: timeseries_timesfmToCurve.py
name: Timeseries P2C LoRA test with embedding
method: grid
metric:
  goal: maximize
  name: acc_val_curve
parameters:
  net_kwargs:
    parameters:
      horizon_len:
        value: 128
      use_positional_embedding:
        value: True
      context_len:
        value: 3200
  eval_every_n_batch:
    value: 50
  lora_params:
    parameters:
      use_lora:
        value: True
      r:
        value: 8
      filter_masks:
        values:
          # - [{keys: ["query", "w"], op: "all", dims: [0, 2]},]          
          # - [{keys: ["value", "w"], op: "all", dims: [0, 2]},]          
          # - [{keys: ["value", "w"], op: "all", dims: [2, 0]},]          
          - [{keys: ["value", "w"], op: "all", dims: [0, 2]}, {keys: ["query", "w"], op: "all", dims: [0, 2]}]          
  curve_params:
    parameters:
      k:
        value: 2
      batch_size:
        value: 512
      natural_parameterization:
        value: False
      gravity:
        value: 0.0
      energy_weakening:
        value: 1.
      regularizer:
        value: False
      weight_decay:
        value: 0.0
      remove_initial_permutation:
        value: False
      jitter:
        value: 1e-2
      num_epochs:
        value: 5
      pretrained:
        value: True

      filter_masks:
        values: 
          # - [{keys: ["input_ff_layer",], op: "all"},]
          # - [{keys: ["input_ff_layer", "horizon_ff_layer"], op: "any"},]
          # - [{keys: ["horizon_ff_layer",], op: "all"},]
          - [{keys: ["query"], op: "all"},]
          - [{keys: ["value"], op: "all"},]
          - [{keys: ["query"], op: "all"}, {keys: ["value"], op: "all"}]

      optimizer_conf:
        parameters:
          name:
            value: "sgd"
          kwargs:
            parameters:
              learning_rate:
                value: 0.0001
              momentum:
                value: 0.9
              nesterov:
                value: True
          grad_clip_norm:
            value: 15.0
          freeze_non_curve_params:
            value: True
  rng_seed:
    values: [1,4]

command:
- ${env}
- ${interpreter}
- ${program}
- "--train"
- "curve"
- "--use-sweep"
#- ${args}
