program: qwen_fineTuning_PtoC.py
name: Qwen LoRA subspace
method: grid
metric:
  goal: maximize
  name: acc_val_curve
parameters:
  save_params:
    value: False
  dataset_path:
    values: ["ddold/qwen_PtoC/winogrande_m_dataset:v0",
             "ddold/qwen_PtoC/winogrande_s_dataset:v0",
             "ddold/qwen_PtoC/boolq_dataset:v0",
             "ddold/qwen_PtoC/obqa_dataset:v0",
             "ddold/qwen_PtoC/ARC-Challenge_dataset:v0",
             "ddold/qwen_PtoC/ARC-Easy_dataset:v0"]
  net_kwargs:
    parameters:
      model_path:
        value: "ddold/qwen_PtoC/qwen2.5_7B_bfloat16:v0"
  eval_every_n_batch:
    value: 25
  lora_params:
    parameters:
      use_lora:
        value: True
      r:
        value: 8
      lora_dtype:
        # value: ["original", "float16", "bfloat16", "float32"]
        value: "float32"
      filter_masks:
        values:
          - [{keys: ["self_attn", "q_proj", "kernel"], op: "all", dims: [0, 1]}, 
             {keys: ["self_attn", "v_proj", "kernel"], op: "all", dims: [0, 1]},
             {keys: ["lm_head", "kernel"], op: "all", dims: [0, 1]}]
          # - [{keys: ["value", "w"], op: "all", dims: [0, 2]},]          
          # - [{keys: ["value", "w"], op: "all", dims: [2, 0]},]          
          # - [{keys: ["value", "w"], op: "all", dims: [0, 2]}, {keys: ["query", "w"], op: "all", dims: [0, 2]}]          
  curve_params:
    parameters:
      k:
        values: [2,]
      batch_size:
        values: [4,]
      natural_parameterization:
        value: False
      gravity:
        value: 0.0
      energy_weakening:
        value: 1.
      regularizer:
        value: False
      weight_decay:
        value: 0.0
      jitter_multiplier:
        value: 1. 
        # fan_in is internal to apply_noise, so we set jitter to 1.
        # np.sqrt(2/3584) np.sqrt(2./fan_in, dtype=np.float32) fan_in= 3584 for q_proj
      num_epochs:
        value: -1
      num_steps:
        value: 5000

      filter_masks:
        values: 
          # - [{keys: ["input_ff_layer",], op: "all"},]
          # - [{keys: ["input_ff_layer", "horizon_ff_layer"], op: "any"},]
          # - [{keys: ["horizon_ff_layer",], op: "all"},]
          - [{keys: ["self_attn", "q_proj", "kernel"], op: "all"},
             {keys: ["self_attn", "v_proj", "kernel"], op: "all"},
             {keys: ["lm_head", "kernel"], op: "all"}]
          # - [{keys: ["self_attn", "q_proj"], op: "all"}]
          # - [{keys: ["value"], op: "all"},]
          # - [{keys: ["query"], op: "all"}, {keys: ["value"], op: "all"}]

      optimizer_conf:
          values:
            # - {name: "adamw", kwargs: {learning_rate: 0.0001, weight_decay: 1e-3}, grad_clip_norm: 100.0, freeze_other_params: True}
            # - {name: "sgd", kwargs: {learning_rate: 0.01, momentum: 0.9, nesterov: True}, grad_clip_norm: 150.0, freeze_other_params: True}
            # - {name: "sgd", kwargs: {learning_rate: 0.001, momentum: 0.9, nesterov: True}, grad_clip_norm: 150.0, freeze_other_params: True}
            # - {name: "sgd", kwargs: {learning_rate: 0.0001, momentum: 0.9, nesterov: True}, grad_clip_norm: 150.0, freeze_other_params: True}
            # - {name: "sgd", kwargs: {learning_rate: {name: "linear_onecycle_schedule", kwargs: {transition_steps: 5_000, peak_value: 1e-4, pct_start: 0.06, pct_final: 1., div_factor: 300.0, final_div_factor: 300}}, momentum: 0.9, nesterov: True}, grad_clip_norm: 100.0, freeze_other_params: True}
            # - {name: "adamw", kwargs: {learning_rate: {name: "linear_onecycle_schedule", kwargs: {transition_steps: 5_000, peak_value: 1e-4, pct_start: 0.06, pct_final: 1., div_factor: 300.0, final_div_factor: 300}}, weight_decay: 1e-4}, grad_clip_norm: 100.0, freeze_other_params: True}
            - {name: "adamw", kwargs: {learning_rate: {name: "linear_onecycle_schedule", kwargs: {transition_steps: 5_000, peak_value: 1e-4, pct_start: 0.06, pct_final: 1., div_factor: 300.0, final_div_factor: 300}}, weight_decay: 0.01}, freeze_other_params: True}
            - {name: "adamw", kwargs: {learning_rate: {name: "linear_onecycle_schedule", kwargs: {transition_steps: 5_000, peak_value: 1e-4, pct_start: 0.06, pct_final: 1., div_factor: 300.0, final_div_factor: 300}}, weight_decay: 0.0}, freeze_other_params: True}
        # parameters:
        #   name:
        #     value: "sgd"
        #   kwargs:
        #     parameters:
        #       learning_rate:
        #         value: 0.0001
        #       momentum:
        #         value: 0.9
        #       nesterov:
        #         value: True
        #   grad_clip_norm:
        #     value: 15.0
        #   freeze_non_curve_params:
        #     value: True
  rng_seed:
    values: [1,4,8,16]

command:
- ${env}
- ${interpreter}
- ${program}
- "--train"
- "curve"
- "--use-sweep"
#- ${args}
