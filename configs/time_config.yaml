program: timeseries_timesfmToCurve.py
name: Timeseries P2C masking
method: grid
metric:
  goal: maximize
  name: acc_val_curve
parameters:
  net_kwargs:
    parameters:
      horizon_len:
        value: 128
      use_positional_embedding:
        value: False
      context_len:
        value: 1152
  eval_every_n_batch:
    value: 50
  curve_params:
    parameters:
      k:
        value: 2
      batch_size:
        value: 128
      natural_parameterization:
        value: False
      gravity:
        value: 0.0
      energy_weakening:
        value: 1.
      regularizer:
        value: False
      weight_decay:
        value: 0.0
      remove_initial_permutation:
        value: False
      jitter:
        value: 1e-8
      num_epochs:
        value: 10
      pretrained:
        value: True

      filter_masks:
        values: 
          - [{keys: ["value", "x_layers_0"], op: "all"},]
          - [{keys: ["value", "w"], op: "all"},]
          - [{keys: ["query", "w"], op: "all"},]

      optimizer_conf:
        parameters:
          name:
            value: "sgd"
          kwargs:
            parameters:
              learning_rate:
                value: 0.0002
              momentum:
                value: 0.9
              nesterov:
                value: True
          grad_clip_norm:
            value: 15.0
          freeze_non_curve_params:
            values: [True, False]
  rng_seed:
    values: [1,4]

command:
- ${env}
- ${interpreter}
- ${program}
- "--train"
- "curve"
- "--use-sweep"
#- ${args}
