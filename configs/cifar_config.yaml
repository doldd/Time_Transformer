program: cifar10_PtoC.py
name: cifar pToC no BatchNorm Curve
method: grid
metric:
  goal: maximize
  name: acc_val_curve
parameters:
  net_kwargs:
    parameters:
      num_blocks:
        value: [3, 3, 3]
      c_hidden:
        value: [16, 32, 64]
      num_classes:
        value: 10
      act_fn:
        value: "relu"
      block_class:
        value: "ResNetBlock"
  params_path:
    value: "ddold/cifar_PtoC/params:v1"
  eval_every_n_batch:
    value: 20
  curve_params:
    parameters:
      k:
        values: [2, 10, 20]
      batch_size:
        value: 200
      natural_parameterization:
        value: False
      gravity:
        values: [0.001, 0.01, 0.1,]
      energy_weakening:
        value: 1.
      regularizer:
        values: ["force", "cosine"]
      weight_decay:
        value: 0.0
      remove_initial_permutation:
        value: False
      jitter:
        value: 1e-8
      num_epochs:
        value: 200
      no_curve_names:
        value: ["BatchNorm",]
      optimizer_conf:
        parameters:
          name:
            value: "sgd"
          kwargs:
            parameters:
              learning_rate:
                value: 0.005
              momentum:
                value: 0.9
              nesterov:
                value: True
  rng_seed:
    values: [0,1,3,4]

command:
- ${env}
- ${interpreter}
- ${program}
- "--train"
- "curve"
- "--use_sweep"
#- ${args}
