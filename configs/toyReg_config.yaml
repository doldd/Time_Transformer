program: toyReg_PtoC.py
name: toyReg curve compare
method: grid
metric:
  goal: maximize
  name: mse_val_curve
parameters:
  net_kwargs:
    parameters:
      depth:
        value: 10
      width:
        value: 10
      activation:
        value: "elu"
  # params_path:
  #   values: ["ddold/toyReg_PtoC/params:v27", "ddold/toyReg_PtoC/params:v26", "ddold/toyReg_PtoC/params:v25", 
  #            "ddold/toyReg_PtoC/params:v24", "ddold/toyReg_PtoC/params:v23", "ddold/toyReg_PtoC/params:v22"]
  eval_every_n_batch:
    value: 1
  curve_params:
    parameters:
      k:
        values: [2, 10, 20]
      batch_size:
        value: 14
      natural_parameterization:
        value: False
      gravity:
        values: [0., 0.01, 0.1, 1.]
      energy_weakening:
        value: 1.
      regularizer:
        values: ["force", "cosine"]
      weight_decay:
        value: 0.0
      remove_initial_permutation:
        value: False
      jitter:
        value: 1e-8
      num_epochs:
        value: 2000
      optimizer_conf:
        parameters:
          name:
            value: "sgd"
          kwargs:
            parameters:
              learning_rate:
                value: 0.0003
              momentum:
                value: 0.9
              nesterov:
                value: True
  rng_seed:
    values: [0,1,2,3,4,5]

command:
- ${env}
- ${interpreter}
- ${program}
- "--train"
- "curve"
- "--use_sweep"
#- ${args}
